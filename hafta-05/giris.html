<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Proje Eşleştirme Platformu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="hesap-sayfasi">
        <section class="tanitim">
            <a href="#" class="logo">Proje<span>Eşleştir</span></a>
            <h1>Tekrar hoş geldin!</h1>
            <ul>
                <li>Başvurularının durumunu takip et</li>
                <li>Mentörünle görüşmelerini gör</li>
                <li>Sana önerilen yeni projelere göz at</li>
            </ul>
        </section>

        <section class="form-alani">
            <h2>Giriş Yap</h2>
            <p class="soluk">Hesabın yok mu? <a href="kayit.html">Kayıt ol</a></p>

            <form class="hesap-formu" action="#" method="post">
                <label for="eposta">E-posta</label>
                <input type="email" id="eposta" name="eposta" required autocomplete="email">

                <label for="sifre">Şifre</label>
                <input type="password" id="sifre" name="sifre" required autocomplete="current-password">

                <div class="satir">
                    <label class="onay"><input type="checkbox" name="hatirla"> <span>Beni hatırla</span></label>
                    <a href="#">Şifremi unuttum</a>
                </div>

                <button type="submit" class="buton buton-tam">Giriş Yap</button>
            </form>
        </section>
    </main>
</body>
</html>
